# ═══════════════════════════════════════════════════════════════════════════════
# SSO SAML CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

# Enable/Disable SSO SAML Authentication
# Set to 'true' to activate SSO, 'false' to use standard OFBiz login
sso.saml.enabled=false

# SAML Service Provider (GZOOM) - Entity ID
# This identifies your application to the Identity Provider
sso.saml.sp.entityid=http://localhost:8080/gzoom-saml-web/metadata.jsp

# SAML Assertion Consumer Service (ACS) - Where IdP sends SAML Response
sso.saml.sp.acs.url=http://localhost:8080/gzoom-saml-web/acs.jsp

# SAML Single Logout Service (SLO) - Optional
sso.saml.sp.slo.url=http://localhost:8080/gzoom-saml-web/sls.jsp

# Frontend URL - Where to redirect after successful SSO login
sso.frontend.url=http://localhost:4200

# Identity Provider (IdP) Configuration - TO BE CONFIGURED AFTER RECEIVING FROM VENDOR
# Leave empty until you receive these details from your SSO provider
sso.saml.idp.entityid=
sso.saml.idp.sso.url=
sso.saml.idp.slo.url=
sso.saml.idp.certificate=

# Debug mode - Set to 'true' for verbose SSO logging
sso.debug.enabled=true

# ═══════════════════════════════════════════════════════════════════════════════
# TOMCAT CONNECTOR - Sviluppo locale (HTTP puro, no proxy)
# ═══════════════════════════════════════════════════════════════════════════════
tomcat.scheme=http
tomcat.secure=false
tomcat.proxyPort=8080
tomcat.proxyName=localhost