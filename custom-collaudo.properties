# ═══════════════════════════════════════════════════════════════════════════════
# GZOOM - Custom Properties - COLLAUDO (staging)
# Attivato da startofbiz.sh quando GZOOM_ENV=collaudo
# ═══════════════════════════════════════════════════════════════════════════════

# CACHE - Medie per collaudo
cache.default_expireTime=1800000
cache.other_expireTime=10000

# DATABASE - PostgreSQL Collaudo
# ATTENZIONE: il DB è sulla macchina 172.20.145.104 (separata dal server app 172.20.145.105)
entityengine.datasource-name-prefix=local
entityengine.datasource-type=postgres
entityengine.jdbc-uri=jdbc:postgresql://172.20.145.104:5432/cardarelli
entityengine.jdbc-password=postgres
entityengine.jdbc-schema=
entityengine.jdbc-username=postgres
entityengine.jdbc-driver=org.postgresql.Driver

# SSO - Abilitato su collaudo
sso.saml.enabled=true
sso.saml.sp.entityid=http://172.20.145.105:8080/gzoom-saml-web/metadata.jsp
sso.saml.sp.acs.url=http://172.20.145.105:8080/gzoom-saml-web/acs.jsp
sso.saml.sp.slo.url=http://172.20.145.105:8080/gzoom-saml-web/sls.jsp
sso.frontend.url=http://172.20.145.105:4200
sso.debug.enabled=true
