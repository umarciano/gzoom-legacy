# ═══════════════════════════════════════════════════════════════════════════════
# GZOOM - Custom Properties - SVILUPPO LOCALE (dev)
# Attivato da startofbiz.sh quando GZOOM_ENV=local (default)
# ═══════════════════════════════════════════════════════════════════════════════

# CACHE - Brevi per sviluppo (aggiornamenti subito visibili)
cache.default_expireTime=10000
cache.other_expireTime=10000

# DATABASE - PostgreSQL locale
# ⚠️  PERSONALIZZABILE: ogni sviluppatore può modificare questi valori
#     in base alla propria configurazione locale. NON committare su git
#     se si cambiano i valori.
#     Esempio configurazioni comuni:
#       jdbc-uri=jdbc:postgresql://localhost:5432/cardarelli   (porta standard)
#       jdbc-uri=jdbc:postgresql://localhost:5433/preprod      (porta alternativa, copia del db)
entityengine.datasource-name-prefix=local
entityengine.datasource-type=postgres
entityengine.jdbc-uri=jdbc:postgresql://localhost:5433/preprod
entityengine.jdbc-password=postgres
entityengine.jdbc-schema=
entityengine.jdbc-username=postgres
entityengine.jdbc-driver=org.postgresql.Driver

# SSO - Disabilitato in locale (usa login standard OFBiz)
sso.saml.enabled=false
sso.saml.sp.entityid=http://localhost:8080/gzoom-saml-web/metadata.jsp
sso.saml.sp.acs.url=http://localhost:8080/gzoom-saml-web/acs.jsp
sso.saml.sp.slo.url=http://localhost:8080/gzoom-saml-web/sls.jsp
sso.frontend.url=http://localhost:4200
sso.debug.enabled=true
