<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Catalogo indicatori</title>
  <style>
    html, body { margin: 0; padding: 0; }
    /* Solo il visore PDF, a tutta larghezza. L'altezza (ampia) viene impostata via JS: il contenitore
       legacy dimensiona l'iframe esterno sull'altezza di questo body, cosi' il PDF appare grande. */
    #viewer { display: block; width: 100%; height: 1300px; border: 0; }
  </style>
</head>
<body>
  <iframe id="viewer" src="CatalogoIndicatori.pdf" title="Catalogo indicatori (PDF)"></iframe>
  <script>
    // Altezza generosa: usa (quasi) l'altezza schermo, con un minimo di 1300px.
    (function () {
      var h = Math.max(1300, (window.screen && window.screen.availHeight ? window.screen.availHeight - 160 : 1300));
      document.getElementById('viewer').style.height = h + 'px';
    })();
  </script>
</body>
</html>
