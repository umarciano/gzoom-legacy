# ═══════════════════════════════════════════════════════════════════════════════
# GZOOM - Custom Properties - PRODUZIONE
# Attivato da setenv.sh/setenv.bat quando GZOOM_ENV=prod
# ⚠️  Non committare mai password reali su git!
# ═══════════════════════════════════════════════════════════════════════════════

# CACHE - Tempi lunghi per produzione
cache.default_expireTime=3600000
cache.other_expireTime=0

# DATABASE - PostgreSQL Produzione
# ⚠️  Sostituire i placeholder con i valori reali prima del go-live
entityengine.datasource-name-prefix=local
entityengine.datasource-type=postgres
entityengine.jdbc-uri=jdbc:postgresql://PROD_DB_HOST:5432/cardarelli
entityengine.jdbc-password=YOUR_PROD_PASSWORD_HERE
entityengine.jdbc-schema=
entityengine.jdbc-username=gzoom_prod
entityengine.jdbc-driver=org.postgresql.Driver

# SSO - Abilitato in produzione
sso.saml.enabled=true
sso.saml.sp.entityid=https://PROD_HOST/gzoom-saml-web/metadata.jsp
sso.saml.sp.acs.url=https://PROD_HOST/gzoom-saml-web/acs.jsp
sso.saml.sp.slo.url=https://PROD_HOST/gzoom-saml-web/sls.jsp
sso.frontend.url=https://PROD_HOST
sso.debug.enabled=false
