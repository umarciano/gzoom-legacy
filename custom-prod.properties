# ═══════════════════════════════════════════════════════════════════════════════
# GZOOM - Custom Properties - PRODUZIONE
# Attivato da setenv.sh/setenv.bat quando GZOOM_ENV=prod
# ⚠️  Non committare mai password reali su git!
# ═══════════════════════════════════════════════════════════════════════════════

# CACHE - Tempi lunghi per produzione
cache.default_expireTime=3600000
cache.other_expireTime=0

# DATABASE - PostgreSQL Produzione
entityengine.datasource-name-prefix=local
entityengine.datasource-type=postgres
entityengine.jdbc-uri=jdbc:postgresql://172.20.131.11:5432/cardarelli
entityengine.jdbc-password=yRG5&Laj
entityengine.jdbc-schema=
entityengine.jdbc-username=gzoom_user
entityengine.jdbc-driver=org.postgresql.Driver

# SSO - Abilitato in produzione
sso.saml.enabled=true
sso.saml.sp.entityid=https://performance.ospedalecardarelli.it/gzoom-saml-web/metadata.jsp
sso.saml.sp.acs.url=https://performance.ospedalecardarelli.it/gzoom-saml-web/acs.jsp
sso.saml.sp.slo.url=https://performance.ospedalecardarelli.it/gzoom-saml-web/sls.jsp
sso.frontend.url=https://performance.ospedalecardarelli.it/gzoom2
sso.debug.enabled=false

# ═══════════════════════════════════════════════════════════════════════════════
# TOMCAT CONNECTOR - SSL Offloading (produzione dietro reverse proxy/bilanciatore)
# Apache/bilanciatore termina HTTPS → Tomcat deve sapere che gira "come se" fosse HTTPS
# Necessario per la libreria SAML (onelogin) che confronta l'URL ACS con https://
# ═══════════════════════════════════════════════════════════════════════════════
tomcat.scheme=https
tomcat.secure=true
tomcat.proxyPort=443
tomcat.proxyName=performance.ospedalecardarelli.it
