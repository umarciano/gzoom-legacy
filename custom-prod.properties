# SSO SAML CONFIGURATION - PRODUCTION
# ═══════════════════════════════════════════════════════════════════════════════

# Enable/Disable SSO SAML Authentication
# ⚠️ Set to 'true' only after successful collaudo testing
sso.saml.enabled=true

# SAML Service Provider (GZOOM) - Production URLs
# ⚠️ REPLACE WITH ACTUAL PRODUCTION DOMAIN
sso.saml.sp.entityid=https://gzoom.yourdomain.com/gzoom-saml-web/metadata.jsp
sso.saml.sp.acs.url=https://gzoom.yourdomain.com/gzoom-saml-web/acs.jsp
sso.saml.sp.slo.url=https://gzoom.yourdomain.com/gzoom-saml-web/sls.jsp

# Frontend URL - Production
# ⚠️ REPLACE WITH ACTUAL PRODUCTION DOMAIN
sso.frontend.url=https://gzoom.yourdomain.com

# Identity Provider Configuration
# ⚠️ TO BE CONFIGURED WITH PRODUCTION IdP DETAILS
sso.saml.idp.entityid=
sso.saml.idp.sso.url=
sso.saml.idp.slo.url=
sso.saml.idp.certificate=

# Debug mode - Disabled in production
sso.debug.enabled=false
